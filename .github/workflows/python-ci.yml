name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  non-integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run non-integration tests
        run: python -m pytest -m "not integration" -v

  postgresql-integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hit_test
          POSTGRES_USER: hit_user
          POSTGRES_PASSWORD: hit_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hit_user -d hit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://hit_user:hit_password@localhost:5432/hit_test
      PGPASSWORD: hit_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply test database schema
        run: psql -h localhost -U hit_user -d hit_test -f sql/schema.sql

      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag hit-api:ci-check .
