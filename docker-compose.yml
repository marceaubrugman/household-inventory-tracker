services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hit-api:v0.4-dev
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hit
      POSTGRES_USER: hit_user
      POSTGRES_PASSWORD: hit_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: