services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hit-api:v0.4-dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hit_user:hit_password@db:5432/hit
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hit
      POSTGRES_USER: hit_user
      POSTGRES_PASSWORD: hit_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: